# The smallest pipeline: on every push GitHub lends us a fresh Ubuntu machine,
# runs these steps on it and throws it away. Add steps at the end, live.
name: hola

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  hola:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Which machine did I get
        run: |
          cat /etc/os-release | head -2
          uname -a
          whoami
          echo "CPUs: $(nproc)"
          free -h | head -2
          df -h / | tail -1

      - name: What it already has installed
        run: |
          docker --version
          python3 --version
          git --version
          gcloud --version | head -1

      - name: Our code is NOT there until we check it out
        run: ls -la

      - uses: actions/checkout@v4

      - name: Now it is
        run: |
          ls -la
          cat saludo.txt

      - name: Run our own code
        run: python3 hola.py

      - name: Who runs this, and on what
        run: |
          echo "Repo:     $GITHUB_REPOSITORY"
          echo "Lo lanzó: $GITHUB_ACTOR"
          echo "Evento:   $GITHUB_EVENT_NAME"
          echo "Commit:   ${GITHUB_SHA::7}"
          echo "Run:      $GITHUB_RUN_NUMBER"
          echo "Runner:   $RUNNER_OS $RUNNER_ARCH"

      # A variable is printed as is; a secret, never: GitHub masks it with ***.
      - name: Repository variable and secret
        env:
          SALUDO: ${{ vars.SALUDO }}
          CLAVE: ${{ secrets.CLAVE_DE_PRUEBA }}
        run: |
          echo "Variable SALUDO: $SALUDO"
          echo "Secret CLAVE_DE_PRUEBA: $CLAVE"
          echo "El secret tiene ${#CLAVE} caracteres"

      # Add new steps below this line.
      - name: Configurar Python para el modelo
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test mi-modelo con pytest
        run: |
          python -m pip install -r mi-modelo/requirements.txt
          cd mi-modelo
          python -m pytest -q tests/

      - name: Docker build mi-modelo
        run: docker build -t mi-modelo:${GITHUB_SHA::7} ./mi-modelo
          
      - name: docker build (the same command as on the laptop)
        run: docker build -t hola:${GITHUB_SHA::7} .

      - name: docker run (now hola.py runs inside a container)
        run: docker run --rm -e GITHUB_ACTOR -e GITHUB_EVENT_NAME hola:${GITHUB_SHA::7}

      - name: The image we just built
        run: docker images hola

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Who am I in GCP
        run: gcloud auth list

      - name: Read something (images in Artifact Registry)
        run: gcloud artifacts docker images list us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/infra-cloud-template --limit 5

      - name: docker push to Artifact Registry
        run: |
          IMAGE=us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/infra-cloud-template/hola
          SHA=${GITHUB_SHA::7}

          # Validar el formato del tag semántico
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag inválido. Usar vX.Y.Z"
            exit 1
          fi

          # Autenticarse y publicar con el SHA
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker tag hola:$SHA "$IMAGE:$SHA"
          docker push "$IMAGE:$SHA"
          echo "::notice::pushed $IMAGE:$SHA"

          # Si es una versión semántica, publicar también ese tag
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            docker tag hola:$SHA "$IMAGE:$GITHUB_REF_NAME"
            docker push "$IMAGE:$GITHUB_REF_NAME"
            echo "::notice::pushed $IMAGE:$GITHUB_REF_NAME"
          fi
